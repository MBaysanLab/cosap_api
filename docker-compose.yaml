services:
  # Add init container to fix permissions
  fix-permissions:
    image: alpine:latest
    command: >
      sh -c "
        chown -R 1000:1000 /user_files &&
        chmod -R 755 /user_files &&
        mkdir -p /static_host &&
        chmod 755 /static_host &&
        echo 'Permissions fixed successfully'
      "
    volumes:
      - ${COSAP_MEDIA_ROOT}:/user_files
      - ${COSAP_STATIC_ROOT}:/static_host
    restart: "no"

  cosap:
    image: itubioinformatics/cosap:latest
    volumes:
      - ${COSAP_MEDIA_ROOT}:/user_files
      - ${COSAP_HG38_BUNDLE}:/cosap_data
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      [
        "bash",
        "-l",
        "-c",
        "celery -A cosap.celery.celery worker -l INFO -Q cosap_worker -c 3 -n cosap_worker@%h -Ofair",
      ]
    env_file:
      - .env
    working_dir: /user_files
    depends_on:
      - fix-permissions

  db:
    image: postgres:latest
    volumes:
      - ${COSAP_DB_DATA}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${COSAP_DB_NAME}
      - POSTGRES_USER=${COSAP_DB_USER}
      - POSTGRES_PASSWORD=${COSAP_DB_PASSWORD}
    restart: unless-stopped
    ports:
      - "5432:5432"
    command: bash -c "chown -R postgres:postgres /var/lib/postgresql/data && docker-entrypoint.sh postgres"

  web:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile
    command:
      [
        "sh", "-c",
        "python manage.py wait_for_db && python manage.py collectstatic --noinput && gunicorn cosap_api.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --keep-alive 5 --max-requests 1000 --max-requests-jitter 50 --preload --access-logfile - --error-logfile -"
      ]
    volumes:
      - ${COSAP_MEDIA_ROOT}:/user_files
      - static_volume:/webapi/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - fix-permissions
      - db
      - prometheus
      - redis
    restart: unless-stopped

  celeryworker:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile
    command: celery -A cosap_api worker -l INFO
    volumes:
      - ${COSAP_MEDIA_ROOT}:/user_files
    env_file:
      - .env
    depends_on:
      - fix-permissions
      - db
      - redis
      - rabbitmq
    restart: unless-stopped

  redis:
    image: redis
    expose:
      - "6379"
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST:-vhost}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    volumes:
      - elasticsearchdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  # Monitoring Stack Integration
  prometheus:
    image: prom/prometheus:latest
    container_name: cosap-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=20GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.wal-compression'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: cosap-grafana
    ports:
      - "3001:3000" 
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: cosap-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: cosap-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_USER=${COSAP_DB_USER}
      - DATA_SOURCE_PASS=${COSAP_DB_PASSWORD}
      - DATA_SOURCE_URI=db:5432/${COSAP_DB_NAME}?sslmode=disable
    depends_on:
      - db
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: cosap-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: cosap-rabbitmq-exporter
    ports:
      - "9419:9419"
    environment:
      - RABBIT_URL=http://rabbitmq:15672
      - RABBIT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBIT_PASSWORD=${RABBITMQ_DEFAULT_PASS:-guest}
    depends_on:
      - rabbitmq
    restart: unless-stopped

  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:latest
    container_name: cosap-elasticsearch-exporter
    ports:
      - "9114:9114"
    environment:
      - ES_USERNAME=elastic
      - ES_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    command:
      - '--es.uri=http://elasticsearch:9200'
      - '--es.all'
      - '--es.indices'
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  elasticsearchdata:
  prometheus_data:
  grafana_data:
  static_volume:
    driver: local
    driver_opts:
      type: none
      device: ${COSAP_STATIC_ROOT}
      o: bind
