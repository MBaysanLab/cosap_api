services:
  cosap:
    image: itubioinformatics/cosap:latest
    volumes:
      - ${COSAP_MEDIA_ROOT}:/user_files
      - ${COSAP_HG38_BUNDLE}:/cosap_data
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      [
        "bash",
        "-l",
        "-c",
        "celery -A cosap.celery.celery worker -l INFO -Q cosap_worker -c 3 -n cosap_worker@%h -Ofair",
      ]
    env_file:
      - .env
    working_dir: /user_files
  db:
    image: postgres:latest
    volumes:
      - ${COSAP_DB_DATA}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${COSAP_DB_NAME}
      - POSTGRES_USER=${COSAP_DB_USER}
      - POSTGRES_PASSWORD=${COSAP_DB_PASSWORD}
    restart: unless-stopped
    ports:
      - "5432:5432"
    command: bash -c "chown -R postgres:postgres /var/lib/postgresql/data && docker-entrypoint.sh postgres"
  web:
    build: ./docker
    command:
      [
        "bash",
        "-l",
        "-c",
        "python -u manage.py wait_for_db && python manage.py runserver 0:8000",
      ]
    volumes:
      - ${COSAP_MEDIA_ROOT}:/user_files
      - .:/webapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
  celeryworker:
    build: ./docker
    command: celery -A cosap_api worker -l INFO
    volumes:
      - ${COSAP_MEDIA_ROOT}:/user_files
      - .:/webapi
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - rabbitmq
    restart: unless-stopped
  redis:
    image: redis
    expose:
      - "6379"
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_VHOST=vhost
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    volumes:
      - elasticsearchdata:/usr/share/elasticsearch/data
    restart: unless-stopped
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  elasticsearchdata:
